<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reports - Copper Shop Quality Check</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="page-shell">
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-badge" style="margin:0;width:42px;height:42px;font-size:16px;">CS</div>
      <div>
        <h2>Reports</h2>
        <div class="sub">Auto-mail recipients & session log</div>
      </div>
    </div>
    <div class="topbar-right">
      <a class="nav-btn" href="dashboard.html">&larr; Back to Dashboard</a>
      <button class="logout-btn" onclick="handleLogout()">Log Out</button>
    </div>
  </div>

  <div class="panel">
    <label style="margin-top:0;">Add recipient email</label>
    <div class="row-flex">
      <div class="grow"><input type="email" id="newRecipientEmail" placeholder="name@amber.com"></div>
      <button class="accent-btn" onclick="addRecipient()">Add</button>
    </div>
    <div id="recipientList" style="margin-top:14px;"></div>
    <div class="error-msg" id="reportsError"></div>
    <div class="ok-msg" id="reportsOk"></div>
  </div>

  <div class="panel">
    
    <button class="primary-btn" onclick="sendReportNow()">Send Report Now</button>
  </div>

  <footer class="app-footer">Developed by Neeraj Yadav</footer>
</div>

<script src="config.js"></script>
<script>
requireAuth();

async function handleLogout(){ clearAuth(); window.location.href = 'login.html'; }

async function renderRecipients(){
  const data = await api('/api/reports/recipients');
  const box = document.getElementById('recipientList');
  if(data.emails.length === 0){
    box.innerHTML = '<div class="empty-note" style="padding:6px 0;">No recipients added yet.</div>';
    return;
  }
  box.innerHTML = data.emails.map(email => `
    <div class="recipient-row">
      <span>${escapeHtml(email)}</span>
      <button class="icon-btn danger" onclick="removeRecipient('${escapeHtml(email).replace(/'/g,"\\'")}')">Del</button>
    </div>`).join('');
}
async function addRecipient(){
  hideMsg('reportsError'); hideMsg('reportsOk');
  const email = document.getElementById('newRecipientEmail').value.trim();
  if(!email) return;
  try {
    await api('/api/reports/recipients', { method:'POST', body: JSON.stringify({ email }) });
    document.getElementById('newRecipientEmail').value = '';
    await renderRecipients();
  } catch(err){ showMsg('reportsError', err.message); }
}
async function removeRecipient(email){
  await api('/api/reports/recipients/' + encodeURIComponent(email), { method:'DELETE' });
  await renderRecipients();
}
async function sendReportNow(){
  hideMsg('reportsError'); hideMsg('reportsOk');
  try {
    const data = await api('/api/reports/send', { method:'POST', body: JSON.stringify({}) });
    showMsg('reportsOk', data.message);
  } catch(err){ showMsg('reportsError', err.message); }
}

renderRecipients();
</script>
</body>
</html>
