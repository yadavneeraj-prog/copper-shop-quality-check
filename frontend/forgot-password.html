<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password - Copper Shop Quality Check</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>

<div class="card">
  <a class="back-link" href="login.html">&larr; Back to sign in</a>
  <div class="logo-badge">CS</div>
  <h1 class="title">Reset Password</h1>
  <p class="subtitle" id="forgotSubtitle">We'll email a one-time code (OTP) to your account's email</p>

  <div id="forgotStep1">
    <label>Registered Email</label>
    <input type="email" id="forgotEmail" placeholder="you@amber.com">
    <div class="error-msg" id="forgotError"></div>
    <div class="ok-msg" id="forgotOk"></div>
    <button class="primary-btn" id="forgotBtn" onclick="handleForgotRequest()">Send OTP</button>
  </div>

  <div id="forgotStep2" class="hidden">
    <label>OTP sent to your email</label>
    <input type="text" id="resetOtp" placeholder="6-digit OTP">
    <label>New Password</label>
    <div class="input-wrap">
      <input type="password" id="resetNewPassword" placeholder="New password">
      <button class="eye-btn" onclick="toggleEye('resetNewPassword', this)">show</button>
    </div>
    <div class="error-msg" id="resetError"></div>
    <div class="ok-msg" id="resetOk"></div>
    <button class="primary-btn" id="resetBtn" onclick="handleResetPassword()">Reset Password</button>
  </div>

  <footer class="card-footer">Developed by Neeraj Yadav</footer>
</div>

<script src="config.js"></script>
<script>
async function handleForgotRequest(){
  hideMsg('forgotError'); hideMsg('forgotOk');
  const email = document.getElementById('forgotEmail').value.trim();
  if(!email){ showMsg('forgotError','Please enter your registered email.'); return; }

  const btn = document.getElementById('forgotBtn'); btn.disabled = true;
  try {
    const data = await api('/api/auth/forgot-password', { method:'POST', body: JSON.stringify({ email }) });
    showMsg('forgotOk', data.message || 'OTP sent, check your email.');
    document.getElementById('forgotStep1').classList.add('hidden');
    document.getElementById('forgotStep2').classList.remove('hidden');
    document.getElementById('forgotSubtitle').textContent = 'Enter the OTP emailed to ' + email;
  } catch (err) {
    showMsg('forgotError', err.message);
  } finally { btn.disabled = false; }
}

async function handleResetPassword(){
  hideMsg('resetError'); hideMsg('resetOk');
  const email = document.getElementById('forgotEmail').value.trim();
  const otp = document.getElementById('resetOtp').value.trim();
  const newPassword = document.getElementById('resetNewPassword').value;
  if(!otp || !newPassword){ showMsg('resetError','Enter the OTP and a new password.'); return; }

  const btn = document.getElementById('resetBtn'); btn.disabled = true;
  try {
    await api('/api/auth/reset-password', { method:'POST', body: JSON.stringify({ email, otp, newPassword }) });
    showMsg('resetOk','Password updated. Redirecting to sign in...');
    setTimeout(()=> window.location.href = 'login.html', 1300);
  } catch (err) {
    showMsg('resetError', err.message);
  } finally { btn.disabled = false; }
}
</script>
</body>
</html>
